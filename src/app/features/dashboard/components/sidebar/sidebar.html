<aside class="sidebar">

  <!-- Logo -->
  <div class="sidebar-logo">

    <div class="logo-mark">
      P
    </div>

    <div class="logo-text">
      <strong>PrabhuKripa</strong>
      <span>Student OS</span>
    </div>

  </div>


  <!-- Main Navigation -->
  <nav class="sidebar-nav">

    <p class="nav-label">
      LEARNING
    </p>

    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="nav-item"
    >
      <span class="nav-icon">⌂</span>
      <span>Dashboard</span>
    </a>


    <a
      routerLink="/notes"
      routerLinkActive="active"
      class="nav-item"
    >
      <span class="nav-icon">📝</span>
      <span>My Notes</span>
    </a>


    <a
      routerLink="/quiz"
      routerLinkActive="active"
      class="nav-item"
    >
      <span class="nav-icon">🤖</span>
      <span>AI Quiz</span>
    </a>


    <a
      routerLink="/progress"
      routerLinkActive="active"
      class="nav-item"
    >
      <span class="nav-icon">📈</span>
      <span>My Progress</span>
    </a>


    <a
      routerLink="/challenges"
      routerLinkActive="active"
      class="nav-item"
    >
      <span class="nav-icon">🔥</span>
      <span>Challenges</span>
    </a>


    <p class="nav-label secondary-label">
      DISCOVER
    </p>


    <a
      routerLink="/stories"
      routerLinkActive="active"
      class="nav-item"
    >
      <span class="nav-icon">📰</span>
      <span>Today's Stories</span>
    </a>


    <a
      routerLink="/community"
      routerLinkActive="active"
      class="nav-item"
    >
      <span class="nav-icon">💬</span>
      <span>Community</span>
    </a>


    <a
      routerLink="/articles"
      routerLinkActive="active"
      class="nav-item"
    >
      <span class="nav-icon">📚</span>
      <span>Articles</span>
    </a>

  </nav>


  <!-- Bottom -->
  <div class="sidebar-bottom">

    <a
      routerLink="/settings"
      class="nav-item"
    >
      <span class="nav-icon">⚙️</span>
      <span>Settings</span>
    </a>


    <a
      routerLink="/login"
      class="nav-item logout"
    >
      <span class="nav-icon">↪</span>
      <span>Logout</span>
    </a>

  </div>

</aside>
